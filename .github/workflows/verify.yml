name: Verify the geometric surface listener
on:
  push:
    paths:
      - "gn/**"
      - "surface.py"
      - "experiments/**"
      - "tests/**"
      - ".github/workflows/verify.yml"
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install -r requirements.txt
      - name: Unit and parity tests
        run: python -m unittest discover -s tests -v
      - name: Phase and six-unit experiment
        run: python experiments/probe.py
      - name: Upload numerical receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-listener-results
          path: results/probe.json
          if-no-files-found: ignore
